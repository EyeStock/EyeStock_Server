spring:
  data:
    redis:
      host: redis
      port: 6379
  datasource:
    url: jdbc:mysql://${EC2_HOST}:3306/${DB_NAME}?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${ACCESS_EXPIRATION}      # 1시간 (ms)
  refresh-expiration: ${REFRESH_EXPIRATION}

server:
  port: 8080
