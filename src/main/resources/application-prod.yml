spring:
  data:
    redis:
      host: redis
      port: 6379
  datasource:
    url: jdbc:mysql://<EC2_HOST>:3306/<DB_NAME>?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: <DB_USER>
    password: <DB_PWD>
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8080
